services:
  - type: web
    name: palette-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you set this manually in the Render dashboard
      - key: FRONTEND_ORIGIN
        sync: false          # you set this to your Vercel URL after deploying frontend
