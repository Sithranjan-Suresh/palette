services:
  - type: web
    name: palette-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt --only-binary pydantic-core
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ALLOW_ALL_CORS
        value: "true"
